<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣天氣查詢</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #89CFF0, #4682B4);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }

        h2 {
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        select {
            background: #fff;
            color: #444;
        }

        button {
            background: #004E92;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #003f78;
        }

        .weather-box {
            margin-top: 20px;
            background: rgba(255,255,255,0.25);
            border-radius: 12px;
            padding: 15px;
            line-height: 1.8;
        }

        .loading {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>🌤 台灣天氣查詢系統</h2>

    <div class="card">
        <!-- 下拉式選單 -->
        <select id="city">
            <option value="臺北市">臺北市</option>
            <option value="新北市">新北市</option>
            <option value="桃園市">桃園市</option>
            <option value="臺中市">臺中市</option>
            <option value="臺南市">臺南市</option>
            <option value="高雄市">高雄市</option>
            <option value="新竹市">新竹市</option>
            <option value="苗栗縣">苗栗縣</option>
            <option value="彰化縣">彰化縣</option>
            <option value="南投縣">南投縣</option>
            <option value="雲林縣">雲林縣</option>
            <option value="嘉義市">嘉義市</option>
            <option value="嘉義縣">嘉義縣</option>
            <option value="屏東縣">屏東縣</option>
            <option value="宜蘭縣">宜蘭縣</option>
            <option value="花蓮縣">花蓮縣</option>
            <option value="臺東縣">臺東縣</option>
            <option value="澎湖縣">澎湖縣</option>
        </select>

        <button onclick="getWeather()">查詢天氣</button>

        <div class="loading" id="loading" style="display:none;">讀取中...</div>

        <div class="weather-box" id="weatherBox" style="display:none;"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value;
            const loading = document.getElementById("loading");
            const box = document.getElementById("weatherBox");

            box.style.display = "none";
            loading.style.display = "block";

            // 🔥 在這裡換成你的 Render API
            const API_BASE = "https://weatherapi-gw90.onrender.com";

            const url = `${API_BASE}/weather?city=${city}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                loading.style.display = "none";

                if (data.error) {
                    box.style.display = "block";
                    box.innerHTML = "⚠️ 取得資料時發生錯誤：" + data.error;
                    return;
                }

                const weather = data.weather;

                box.style.display = "block";
                box.innerHTML = `
                    <strong>📍 地點：</strong> ${data.location}<br>
                    <strong>🌦 天氣狀況：</strong> ${weather.Wx || "—"}<br>
                    <strong>🌡 溫度：</strong> ${weather.T || "—"}<br>
                    <strong>💧 降雨機率：</strong> ${weather.PoP || "—"}<br>
                    <strong>🌫 體感：</strong> ${weather.CI || "—"}
                `;
            } catch (err) {
                loading.style.display = "none";
                box.style.display = "block";
                box.innerHTML = "❌ 網路錯誤或無法連線 API";
            }
        }
    </script>

</body>
</html>
